<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crocusPetal1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4D2E68"/>
      <stop offset="45%" stop-color="#7B4B9C"/>
      <stop offset="100%" stop-color="#9E6EC2"/>
    </linearGradient>
    <linearGradient id="crocusPetal2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5A3579"/>
      <stop offset="50%" stop-color="#8857A8"/>
      <stop offset="100%" stop-color="#AB79CF"/>
    </linearGradient>
    <radialGradient id="crocusCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3A8"/>
      <stop offset="55%" stop-color="#F4C430"/>
      <stop offset="100%" stop-color="#D99A27"/>
    </radialGradient>
    <filter id="crocusShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1F1E1B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#crocusShadow)">
    <!-- Outer 3 Crocus sativus Petals -->
    <path d="M50 50 C41 33 28 14 50 6 C72 14 59 33 50 50 Z" fill="url(#crocusPetal1)"/>
    <path d="M50 50 C41 33 28 14 50 6 C72 14 59 33 50 50 Z" fill="url(#crocusPetal1)" transform="rotate(120 50 50)"/>
    <path d="M50 50 C41 33 28 14 50 6 C72 14 59 33 50 50 Z" fill="url(#crocusPetal1)" transform="rotate(240 50 50)"/>

    <!-- Inner 3 Crocus sativus Petals -->
    <path d="M50 50 C43 35 34 20 50 12 C66 20 57 35 50 50 Z" fill="url(#crocusPetal2)" transform="rotate(60 50 50)"/>
    <path d="M50 50 C43 35 34 20 50 12 C66 20 57 35 50 50 Z" fill="url(#crocusPetal2)" transform="rotate(180 50 50)"/>
    <path d="M50 50 C43 35 34 20 50 12 C66 20 57 35 50 50 Z" fill="url(#crocusPetal2)" transform="rotate(300 50 50)"/>

    <!-- Subtle Petal Veins -->
    <path d="M50 48 Q50 25 50 10" stroke="#3A1C52" stroke-width="0.8" opacity="0.5" fill="none"/>
    <path d="M50 48 Q50 25 50 10" stroke="#3A1C52" stroke-width="0.8" opacity="0.5" fill="none" transform="rotate(60 50 50)"/>
    <path d="M50 48 Q50 25 50 10" stroke="#3A1C52" stroke-width="0.8" opacity="0.5" fill="none" transform="rotate(120 50 50)"/>
    <path d="M50 48 Q50 25 50 10" stroke="#3A1C52" stroke-width="0.8" opacity="0.5" fill="none" transform="rotate(180 50 50)"/>
    <path d="M50 48 Q50 25 50 10" stroke="#3A1C52" stroke-width="0.8" opacity="0.5" fill="none" transform="rotate(240 50 50)"/>
    <path d="M50 48 Q50 25 50 10" stroke="#3A1C52" stroke-width="0.8" opacity="0.5" fill="none" transform="rotate(300 50 50)"/>

    <!-- Golden Throat & Stamens -->
    <circle cx="50" cy="50" r="6" fill="url(#crocusCenter)"/>

    <!-- Three Vibrant Scarlet-Red Saffron Stigmas -->
    <path d="M50 50 C51 44 54 38 57 32 C58 30 61 31 60 34 C58 40 54 46 50 50 Z" fill="#D62817" stroke="#9A1508" stroke-width="0.4"/>
    <path d="M50 50 C51 44 54 38 57 32 C58 30 61 31 60 34 C58 40 54 46 50 50 Z" fill="#D62817" stroke="#9A1508" stroke-width="0.4" transform="rotate(120 50 50)"/>
    <path d="M50 50 C51 44 54 38 57 32 C58 30 61 31 60 34 C58 40 54 46 50 50 Z" fill="#D62817" stroke="#9A1508" stroke-width="0.4" transform="rotate(240 50 50)"/>
  </g>
</svg>

